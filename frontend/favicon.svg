<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AI Global Risk">
  <defs>
    <linearGradient id="bg" x1="12" y1="8" x2="52" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1f7a8c"/>
      <stop offset="100%" stop-color="#155c68"/>
    </linearGradient>
    <linearGradient id="accent" x1="18" y1="40" x2="50" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f0a35a"/>
      <stop offset="100%" stop-color="#d9822b"/>
    </linearGradient>
  </defs>

  <!-- App mark -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Soft globe glow -->
  <circle cx="32" cy="32" r="20" fill="#0f3f48" opacity="0.35"/>

  <!-- Globe -->
  <circle cx="32" cy="32" r="16.5" fill="none" stroke="#e8f4f6" stroke-width="2.2"/>
  <ellipse cx="32" cy="32" rx="7.5" ry="16.5" fill="none" stroke="#e8f4f6" stroke-width="1.6" opacity="0.9"/>
  <path d="M16 26.5h32M16 37.5h32" fill="none" stroke="#e8f4f6" stroke-width="1.6" opacity="0.85"/>

  <!-- Forecast spark / rising risk trend -->
  <path
    d="M18.5 43.5c4.2-1.2 7.2-6.8 10.8-7.6 3.2-.7 5.6 3.2 8.7 2.4 3.4-.9 6.8-6.8 9.5-10.3"
    fill="none"
    stroke="url(#accent)"
    stroke-width="3.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="47.5" cy="28" r="3.1" fill="#d9822b"/>
  <circle cx="47.5" cy="28" r="1.4" fill="#fff6eb"/>
</svg>
